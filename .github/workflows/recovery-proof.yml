name: Recovery six-proof package checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: recovery-proof-${{ github.ref }}
  cancel-in-progress: true
jobs:
  recovery-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '2'
      RAYON_NUM_THREADS: '2'
      CARGO_TARGET_DIR: ${{ github.workspace }}/kpi/.local/ci-target
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: kpi
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: kaspanet/rusty-kaspa
          ref: 01b532e8b553523216471682649693af92f0fd16
          path: upstream/rusty-kaspa
          persist-credentials: false
      - name: Pinned Rust and native build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang libclang-dev llvm-dev cmake pkg-config libssl-dev protobuf-compiler
          rustup toolchain install 1.91.0 --profile minimal --component rustfmt
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            kpi/.local/ci-target
          key: rust-ubuntu24-x64-1.91.0-01b532e-recovery-native-${{ hashFiles('kpi/poc/**/Cargo.lock') }}
          restore-keys: |
            rust-ubuntu24-x64-1.91.0-01b532e-recovery-native-
            rust-ubuntu24-x64-1.91.0-01b532e-recovery-
            rust-ubuntu24-x64-1.91.0-01b532e-private-native-tn10-
      - name: Native relation regressions and retained guest package
        working-directory: kpi
        run: |
          test "$(git -C ../upstream/rusty-kaspa rev-parse HEAD)" = 01b532e8b553523216471682649693af92f0fd16
          export BINDGEN_EXTRA_CLANG_ARGS="-isystem $(cc -print-file-name=include)"
          cargo +1.91.0 fmt --manifest-path poc/recovery-proof/Cargo.toml --check
          cargo +1.91.0 test --locked --release --manifest-path poc/recovery-proof/Cargo.toml
          python3 poc/recovery-proof/check_package.py
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s poc/remote-cuda -p 'test_recovery*.py' -v
          cargo +1.91.0 build --locked --release --manifest-path poc/recovery-native/Cargo.toml --bin kpi-recovery-native-host
          python3 poc/recovery-native/check_evidence.py .local/ci-target/release/kpi-recovery-native-host
