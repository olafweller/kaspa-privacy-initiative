name: Documentation correction
description: Fix a factual claim, source link, unclear assumption, or contributor instruction
title: "[Docs] "
labels: ["documentation"]
body:
  - type: textarea
    id: location
    attributes:
      label: Location and problem
      description: Link the file or section and describe what is incorrect or unclear.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and proposed correction
      description: Prefer primary sources with exact commits. Separate verified facts from hypotheses.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Security or architecture impact
      description: Does this affect an invariant, trust assumption, or ADR?
