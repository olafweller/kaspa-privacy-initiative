[package]
name = "kpi-private-note-chain"
version = "0.1.0"
edition = "2021"
publish = false
[dependencies]
kpi-private-note-wallet = { path = "../../private-note-wallet", default-features = false, features = ["tn10-rehearsal"] }
kpi-accelerated-bn254 = { path = "../../accelerated-bn254/common" }
kpi-lane-common = { path = "../../lane-completeness/common" }
serde = { version = "=1.0.228", features = ["derive"] }
ark-bn254 = { version = "=0.5.0", default-features = false, features = ["curve", "std"] }
ark-groth16 = { version = "=0.5.0", default-features = false, features = ["std"] }
ark-serialize = { version = "=0.5.0", default-features = false, features = ["std"] }
vprogs-core-codec = { git = "https://github.com/kaspanet/vprogs", rev = "f9b84a863a7c7c20586a9cf947550475e894f72e" }
vprogs-core-smt = { git = "https://github.com/kaspanet/vprogs", rev = "f9b84a863a7c7c20586a9cf947550475e894f72e" }
vprogs-zk-abi = { git = "https://github.com/kaspanet/vprogs", rev = "f9b84a863a7c7c20586a9cf947550475e894f72e", default-features = false }
vprogs-zk-backend-risc0-api = { git = "https://github.com/kaspanet/vprogs", rev = "f9b84a863a7c7c20586a9cf947550475e894f72e", default-features = false }
vprogs-l1-utils = { git = "https://github.com/kaspanet/vprogs", rev = "f9b84a863a7c7c20586a9cf947550475e894f72e" }
kaspa-seq-commit = { git = "https://github.com/kaspanet/rusty-kaspa", branch = "master", default-features = false }
[dev-dependencies]
bincode = "=1.3.3"
serde_json = "=1.0.145"
