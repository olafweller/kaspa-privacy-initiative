[package]
name = "kpi-groth16-comparison"
version = "0.1.0"
edition = "2021"
publish = false
[features]
default = []
circuit = ["ark-r1cs-std", "ark-crypto-primitives/r1cs", "ark-crypto-primitives/crh"]
parallel = ["ark-groth16/parallel", "ark-ff/parallel", "ark-ec/parallel"]
[dependencies]
risc0-zkvm = { version = "=3.0.3", default-features = false, features = ["std"] }
serde = { version = "=1.0.228", features = ["derive"] }
bincode = "=1.3.3"
ark-bn254 = { version = "=0.5.0", default-features = false, features = ["curve", "std"] }
ark-ff = { version = "=0.5.0", default-features = false, features = ["std"] }
ark-ec = { version = "=0.5.0", default-features = false, features = ["std"] }
ark-groth16 = { version = "=0.5.0", default-features = false, features = ["std"] }
ark-serialize = { version = "=0.5.0", default-features = false, features = ["std"] }
ark-relations = { version = "=0.5.1", default-features = false, features = ["std"] }
ark-r1cs-std = { version = "=0.5.0", default-features = false, features = ["std"], optional = true }
ark-crypto-primitives = { version = "=0.5.0", default-features = false, features = ["std"] }
