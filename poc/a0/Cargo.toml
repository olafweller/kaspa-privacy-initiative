[package]
name = "kpi-poc-a0"
version = "0.1.0"
edition = "2024"
rust-version = "1.91.0"
publish = false
license = "Apache-2.0"

[dependencies]
ark-bn254 = "=0.6.0"
ark-ff = "=0.6.0"
ark-groth16 = "=0.6.0"
ark-relations = "=0.6.0"
ark-r1cs-std = "=0.6.0"
ark-crypto-primitives = { version = "=0.6.0", features = ["crh", "constraints"] }
ark-serialize = "=0.6.0"
ark-snark = "=0.6.0"
rand = "=0.8.5"
sha2 = "=0.10.9"
serde_json = "=1.0.145"
secp256k1 = { version = "=0.29.1", features = ["rand-std"] }
kaspa-consensus = { path = "../../../upstream/rusty-kaspa/consensus" }
kaspa-consensus-core = { path = "../../../upstream/rusty-kaspa/consensus/core" }
kaspa-hashes = { path = "../../../upstream/rusty-kaspa/crypto/hashes" }
kaspa-txscript = { path = "../../../upstream/rusty-kaspa/crypto/txscript" }

[profile.dev]
debug = 0
opt-level = 2

[profile.release]
debug = 0
