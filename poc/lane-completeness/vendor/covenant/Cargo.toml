[package]
name = "vprogs-zk-backend-risc0-covenant"
version = "0.1.0"
edition = "2021"
publish = false
license = "ISC"

[workspace]

[features]
# Separate fixed-circuit covenant identity for the shorter live workload.
# The historical offline build keeps its original lift-20 pin by default.
monolithic-lift19 = []

[dependencies]
kaspa-consensus-core = { git = "https://github.com/kaspanet/rusty-kaspa", branch = "master" }
kaspa-hashes = { git = "https://github.com/kaspanet/rusty-kaspa", branch = "master" }
kaspa-txscript = { git = "https://github.com/kaspanet/rusty-kaspa", branch = "master" }
vprogs-zk-abi = { git = "https://github.com/kaspanet/vprogs", rev = "f9b84a863a7c7c20586a9cf947550475e894f72e", default-features = false }

[build-dependencies]
ark-bn254 = "=0.6.0"
ark-groth16 = "=0.6.0"
ark-serialize = "=0.6.0"
bincode = "=1.3.3"
risc0-groth16 = "3.0.3"
risc0-zkvm = "=3.0.3"
sha2 = "=0.10.9"

