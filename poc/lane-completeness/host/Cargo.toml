[package]
name = "kpi-lane-host"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
kpi-lane-common = { path = "../common" }
kaspa-hashes.workspace = true
kaspa-seq-commit.workspace = true
kaspa-smt = { workspace = true, features = ["std", "test-utils"] }
kaspa-consensus-core = { git = "https://github.com/kaspanet/rusty-kaspa", branch = "master" }
kaspa-txscript = { git = "https://github.com/kaspanet/rusty-kaspa", branch = "master" }
vprogs-zk-backend-risc0-covenant = { path = "../vendor/covenant" }
# Official r0vm server performs real CPU proving; avoids compiling native kernels here.
risc0-zkvm = "=3.0.3"
risc0-binfmt = "=3.0.4"
risc0-zkos-v1compat = "=2.2.2"
serde_json = "=1.0.145"
bincode = "=1.3.3"
hex = "=0.4.3"

# vProgs' workspace tracks master. Resolve those dependencies to the same exact node revision.
# The root lockfile records both source selectors; the commits must match.
