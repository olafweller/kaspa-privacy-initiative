[package]
name = "kpi-tn10-integration"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[features]
default = ["monolithic-lift19"]
monolithic-lift19 = ["vprogs-zk-backend-risc0-covenant/monolithic-lift19"]

[dependencies]
kaspa-hashes = { git = "https://github.com/kaspanet/rusty-kaspa", branch = "master" }
kaspa-seq-commit = { git = "https://github.com/kaspanet/rusty-kaspa", branch = "master" }
kaspa-smt = { git = "https://github.com/kaspanet/rusty-kaspa", branch = "master", features = ["std", "test-utils"] }
kaspa-consensus-core = { git = "https://github.com/kaspanet/rusty-kaspa", branch = "master" }
kaspa-rpc-core = { git = "https://github.com/kaspanet/rusty-kaspa", branch = "master" }
vprogs-l1-wallet = { path = "../vendor/wallet" }
serde_json = "=1.0.145"
hex = "=0.4.3"
sha2 = "0.10"
secp256k1 = "0.29.1"
kaspa-addresses = { git = "https://github.com/kaspanet/rusty-kaspa", branch = "master" }
kpi-lane-common = { path = "../common" }
kaspa-txscript = { git = "https://github.com/kaspanet/rusty-kaspa", branch = "master" }
vprogs-zk-backend-risc0-covenant = { path = "../vendor/covenant" }
risc0-zkvm = "=3.0.3"
risc0-binfmt = "=3.0.4"
risc0-zkos-v1compat = "=2.2.2"
bincode = "=1.3.3"

[profile.release]
debug = 0
