[package]
name = "kpi-native-host"
version = "0.1.0"
edition = "2021"
publish = false
[dependencies]
kpi-native-common = { path = "../common" }

kpi-lane-common = { path = "../../lane-completeness/common" }
kaspa-hashes.workspace = true
kaspa-consensus-core.workspace = true
kaspa-rpc-core = { git = "https://github.com/kaspanet/rusty-kaspa", branch = "master" }
kaspa-seq-commit = { git = "https://github.com/kaspanet/rusty-kaspa", branch = "master" }
kaspa-txscript = { git = "https://github.com/kaspanet/rusty-kaspa", branch = "master" }
kaspa-addresses = { git = "https://github.com/kaspanet/rusty-kaspa", branch = "master" }
vprogs-l1-wallet = { path = "../../lane-completeness/vendor/wallet" }
vprogs-zk-backend-risc0-covenant = { path = "../../lane-completeness/vendor/covenant" }
vprogs-zk-backend-risc0-api.workspace = true
vprogs-zk-abi.workspace = true
vprogs-core-types.workspace = true
vprogs-core-codec.workspace = true
vprogs-l1-utils = { git = "https://github.com/kaspanet/vprogs", rev = "f9b84a863a7c7c20586a9cf947550475e894f72e" }
risc0-zkvm = "=3.0.3"
risc0-binfmt = "=3.0.4"
