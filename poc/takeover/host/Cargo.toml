[package]
name = "kpi-takeover-host"
version = "0.1.0"
edition = "2021"
publish = false
[dependencies]
kpi-accelerated-bn254 = { path = "../../accelerated-bn254/common" }
kpi-groth16-comparison = { path = "../../groth16-comparison/common", features = ["circuit", "parallel"] }
ark-bn254 = "=0.5.0"
ark-groth16 = "=0.5.0"
ark-serialize = "=0.5.0"
risc0-zkvm = "=3.0.3"
risc0-binfmt = "=3.0.4"
risc0-zkos-v1compat = "=2.2.2"
bincode = "=1.3.3"
serde_json = "=1.0.145"
hex = "=0.4.3"
kaspa-hashes = { git = "https://github.com/kaspanet/rusty-kaspa", branch = "master" }
vprogs-zk-abi = { git = "https://github.com/kaspanet/vprogs", rev = "f9b84a863a7c7c20586a9cf947550475e894f72e", default-features = false }
vprogs-zk-backend-risc0-api = { git = "https://github.com/kaspanet/vprogs", rev = "f9b84a863a7c7c20586a9cf947550475e894f72e", default-features = false }
vprogs-core-codec = { git = "https://github.com/kaspanet/vprogs", rev = "f9b84a863a7c7c20586a9cf947550475e894f72e" }
vprogs-zk-backend-risc0-covenant = { path = "../vendor/covenant" }
kaspa-seq-commit = { git = "https://github.com/kaspanet/rusty-kaspa", branch = "master" }
kaspa-consensus-core = { git = "https://github.com/kaspanet/rusty-kaspa", branch = "master" }
kaspa-txscript = { git = "https://github.com/kaspanet/rusty-kaspa", branch = "master" }
kpi-native-common = { path = "../../native-value/common" }
kpi-takeover-common = { path = "../common" }
kaspa-addresses = { git = "https://github.com/kaspanet/rusty-kaspa", branch = "master" }
kaspa-rpc-core = { git = "https://github.com/kaspanet/rusty-kaspa", branch = "master" }
vprogs-l1-wallet = { path = "../../lane-completeness/vendor/wallet" }
vprogs-zk-backend-risc0-runtime-processor = { git = "https://github.com/kaspanet/vprogs", rev = "f9b84a863a7c7c20586a9cf947550475e894f72e" }
serde = { version = "=1.0.228", features = ["derive"] }
rand = "0.8"
secp256k1 = "0.29.1"

vprogs-l1-utils = { git = "https://github.com/kaspanet/vprogs", rev = "f9b84a863a7c7c20586a9cf947550475e894f72e" }
vprogs-core-types = { git = "https://github.com/kaspanet/vprogs", rev = "f9b84a863a7c7c20586a9cf947550475e894f72e", default-features = false }

[[bin]]
name = "kpi-takeover-prepare"
path = "src/bin/prepare.rs"

[[bin]]
name = "kpi-takeover-build"
path = "src/bin/build.rs"

[[bin]]
name = "kpi-takeover-verify"
path = "src/bin/verify.rs"
