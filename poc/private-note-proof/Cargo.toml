[package]
name = "kpi-private-note-proof"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[features]
native = ["dep:kaspa-hashes", "dep:kaspa-consensus-core", "dep:kaspa-txscript", "dep:kaspa-txscript-errors", "dep:vprogs-zk-backend-risc0-covenant"]

[dependencies]
risc0-zkvm = "=3.0.3"
risc0-zkp = { version = "=3.0.4", default-features = false }
risc0-circuit-recursion = { version = "=4.0.4", default-features = false }
bincode = "=1.3.3"
hex = "=0.4.3"
serde_json = "=1.0.145"
kaspa-hashes = { git = "https://github.com/kaspanet/rusty-kaspa", branch = "master", optional = true }
kaspa-consensus-core = { git = "https://github.com/kaspanet/rusty-kaspa", branch = "master", optional = true }
kaspa-txscript = { git = "https://github.com/kaspanet/rusty-kaspa", branch = "master", optional = true }
kaspa-txscript-errors = { git = "https://github.com/kaspanet/rusty-kaspa", branch = "master", optional = true }
vprogs-zk-backend-risc0-covenant = { path = "../takeover/vendor/covenant", optional = true }

[[bin]]
name = "kpi-private-note-producer"
path = "src/bin/producer.rs"

[[bin]]
name = "kpi-private-note-verifier"
path = "src/bin/verifier.rs"

[[bin]]
name = "kpi-private-note-native"
path = "src/bin/native.rs"
required-features = ["native"]
